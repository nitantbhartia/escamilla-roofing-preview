<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — Escamilla’s Roofing and Raingutters</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; background: var(--tar); }
    .rev { position: relative; z-index: 1; max-width: 5in; margin: 1.4rem auto 2rem; padding: 0 0.8rem; }
    .rev-card {
      background: var(--paper); color: var(--ink);
      border: 1px solid #8e9690; padding: 1.15rem 1.1rem 1rem;
      box-shadow: 0 0 0 6px #6d7570, 0 0 0 8px #c5ccc6;
    }
    .rev h1 {
      font-size: clamp(1.4rem, 5vw, 1.9rem); margin: 0 0 0.28rem;
      font-family: "Big Shoulders Stencil", "Arial Narrow", sans-serif;
      text-transform: uppercase; line-height: 0.92; font-weight: 800;
    }
    .rev img.qr { width: 200px; height: 200px; display: block; margin: 0.7rem auto; background: #fff; }
    .rev .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.85rem; }
    .rev .actions button, .rev .actions a {
      background: var(--brass); color: var(--tar); text-decoration: none; border: 0;
      padding: 0.38rem 0.62rem; cursor: pointer;
      font-family: "Big Shoulders Stencil", sans-serif;
      letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.92rem; font-weight: 700;
    }
    .scan { margin-top: 0.28rem; text-align: center; font-size: 0.92rem; }
    @media print {
      .lang, .rev .actions { display: none !important; }
      body, html { background: #fff; }
      .rev { margin: 0; }
      .rev-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="rev">
    <div class="rev-card">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-set="en" aria-pressed="true">EN</button>
        <button type="button" data-set="es" aria-pressed="false">ES</button>
      </div>
      <h1>Escamilla’s Roofing and Raingutters</h1>
      <p>Escondido · CA License #1095166 · <a href="tel:+17606398349">(760) 639-8349</a></p>
      <img class="qr" src="review-qr.svg" width="200" height="200" alt="QR code to Escamilla’s Roofing and Raingutters on Yelp">
      <p class="scan" data-en="Scan for Yelp." data-es="Escanee para Yelp.">Scan for Yelp.</p>
      <div class="actions">
        <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
        <a href="index.html" data-en="Back to the coil" data-es="Volver al rollo">Back to the coil</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>

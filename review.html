<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — Escamilla’s Roofing and Raingutters</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .rev { position: relative; z-index: 1; max-width: 520px; margin: 1.6rem auto 2.5rem; padding: 0 1rem; }
    .rev-card {
      background: var(--paper); color: var(--ink);
      border: 1px solid #8e9690; padding: 1.3rem;
      box-shadow: 0 0 0 8px #6d7570, 0 0 0 10px #c5ccc6;
    }
    .rev h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); margin: 0 0 0.4rem; font-family: "Allerta Stencil", "Arial Narrow", sans-serif; text-transform: uppercase; line-height: 0.95; font-weight: 400; }
    .rev img.qr { width: 220px; height: 220px; display: block; margin: 0.9rem auto; background: #fff; }
    .rev .actions { display: flex; gap: 0.55rem; flex-wrap: wrap; margin-top: 1rem; }
    .rev .actions button, .rev .actions a {
      background: var(--brass); color: var(--tar); text-decoration: none; border: 0;
      padding: 0.45rem 0.7rem; cursor: pointer; font-family: "Allerta Stencil", sans-serif;
      letter-spacing: 0.08em; text-transform: uppercase; font-size: 1rem;
    }
    .scan { margin-top: 0.35rem; text-align: center; }
    @media print {
      .lang, .rev .actions { display: none !important; }
      body, html { background: #fff; }
      .rev { margin: 0; }
      .rev-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="rev">
    <div class="rev-card">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-set="en" aria-pressed="true">EN</button>
        <button type="button" data-set="es" aria-pressed="false">ES</button>
      </div>
      <h1>Escamilla’s Roofing and Raingutters</h1>
      <p>Escondido · CA License #1095166 · <a href="tel:+17606398349">(760) 639-8349</a></p>
      <p><a href="mailto:escamillasroofing10@gmail.com">escamillasroofing10@gmail.com</a></p>
      <img class="qr" src="review-qr.svg" width="220" height="220" alt="QR code to Escamilla’s Roofing and Raingutters on Yelp">
      <p class="scan" data-en="Scan to find us on Yelp and leave a review." data-es="Escanee para encontrarnos en Yelp y dejar una reseña.">Scan to find us on Yelp and leave a review.</p>
      <div class="actions">
        <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
        <a href="index.html" data-en="Back to the coil" data-es="Volver al rollo">Back to the coil</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
